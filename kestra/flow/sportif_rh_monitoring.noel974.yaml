id: noel974
namespace: sportif_rh_monitoring

triggers:
  - id: schedule_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"

tasks:
  - id: check_volumetrics
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: kestra_kestra_kestra-net
    beforeCommands:
      - pip install psycopg2-binary requests
    env:
      PG_USERNAME: "{{ secret('PG_USERNAME') }}"
      PG_PASSWORD: "{{ secret('PG_PASSWORD') }}"
      SLACK_WEBHOOK: "{{ secret('SLACK_WEBHOOK') }}"
    script: |
      import os
      import psycopg2
      import requests
      from datetime import datetime

      conn = psycopg2.connect(
          host="postgres_sportif",
          database="sportif",
          user=os.environ["PG_USERNAME"],
          password=os.environ["PG_PASSWORD"]
      )
      cur = conn.cursor()

      alerts = []

      cur.execute("SELECT COUNT(*) FROM employees;")
      nb_employees = cur.fetchone()[0]
      if nb_employees == 0:
          alerts.append("🚨 Table employees vide !")

      cur.execute("SELECT COUNT(*) FROM sport_activities_raw;")
      nb_activities = cur.fetchone()[0]

      cur.execute("""
          SELECT COUNT(*) FROM sport_activities_raw
          WHERE date_activite >= NOW() - INTERVAL '24 hours';
      """)
      nb_recent = cur.fetchone()[0]
      if nb_recent == 0:
          alerts.append("⚠️ Aucune nouvelle activité sportive enregistrée dans les dernières 24h.")

      cur.execute("SELECT COUNT(*) FROM sport_activities_raw WHERE distance_km < 0;")
      nb_negative = cur.fetchone()[0]
      if nb_negative > 0:
          alerts.append(f"🚨 {nb_negative} activités avec une distance négative détectées.")

      cur.execute("SELECT COUNT(*) FROM employees WHERE salaire_brut IS NULL;")
      nb_salaire_null = cur.fetchone()[0]
      if nb_salaire_null > 0:
          alerts.append(f"⚠️ {nb_salaire_null} employés sans salaire renseigné.")

      cur.close()
      conn.close()

      summary = (
          f"📊 *Rapport de monitoring* ({datetime.now().strftime('%Y-%m-%d %H:%M')})\n"
          f"- Employés en base : {nb_employees}\n"
          f"- Activités totales : {nb_activities}\n"
          f"- Activités (24h) : {nb_recent}\n"
      )

      if alerts:
          summary += "\n*Anomalies détectées :*\n" + "\n".join(alerts)
      else:
          summary += "\n✅ Aucune anomalie détectée."

      print(summary)

      requests.post(
          os.environ["SLACK_WEBHOOK"],
          json={"text": summary}
      )
